modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ha7gawa/sleepium/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://modrinth.com/mod/sleepium"
logoFile="sleepium_logo.png"
# the mod list tells of a newer version (update.json in the repository, updated with each release)
updateJSONURL="https://raw.githubusercontent.com/ha7gawa/sleepium/main/update.json"
description='''
Sleepium: server and client optimisations that keep the game's results exact - idle block entities and mobs put to
sleep, a ring event bus, parallel world generation, chunk I/O, a renderer with its own shaderpack support (beta).
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}-opt.mixins.json"

[[mixins]]
config="sleepium-foreign-test.mixins.json"

[[mixins]]
config="sleepium-encrypt-test.mixins.json"

[[mixins]]
config="sleepium-latency-test.mixins.json"

[[mixins]]
config="sleepium-stimulate-test.mixins.json"

[[mixins]]
config="sleepium-ticksplit-test.mixins.json"

[[mixins]]
config="sleepium-offthread-test.mixins.json"

[[mixins]]
config="sleepium-poseleak-test.mixins.json"

[[mixins]]
config="sleepium-geo.mixins.json"
[[mixins]]
config="sleepium-flywheel.mixins.json"
[[mixins]]
config="sleepium-emf.mixins.json"
[[mixins]]
config="sleepium-catnip.mixins.json"
[[mixins]]
config="sleepium-veil.mixins.json"
[[mixins]]
config="sleepium-shaders.mixins.json"

plugins {
    id 'fabric-loom' version '1.14.10'
    id 'java'
}

// Sleepium for Fabric 1.21.1 (lab, 11-25): the world generation and entity rendering parts of the NeoForge branch;
// the files that need NeoForge are left out (fabric-excluded.txt) until each has a Fabric form.
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
tasks.named('jar', Jar).configure { archiveVersion = "${mod_version}+mc${minecraft_version}-fabric" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

def excluded = file('fabric-excluded.txt').readLines().findAll { it.trim() }
sourceSets.main.java {
    excluded.each { exclude it }
    exclude 'testmods/**'
    // other mods' integrations: not in the Fabric alpha
    ['geomixin', 'emfmixin', 'catmixin', 'veilmixin', 'flwmixin', 'dhmixin', 'flowmixin', 'shadermixin'].each { exclude "dev/lull/${it}/**" }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    exclude 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml'
    // only the two configs the Fabric build lists (the integrations' and the test configs stay out)
    exclude { it.name.endsWith('.mixins.json') && !(it.name in ['sleepium.mixins.json', 'sleepium-opt.mixins.json']) }
    exclude 'META-INF/accesstransformer.cfg'
    from('defaults.txt') {
        into 'sleepium'
        filter { line -> line.contains('NetLagMixin') ? null : line }
    }
}

loom {
    runs {
        client { vmArgs '-Dlab.opt.defaults=true' }
        server { vmArgs '-Dlab.opt.defaults=true'
            if (project.hasProperty('runJvmArgs')) vmArgs(project.property('runJvmArgs').toString().split(' ')) }
    }
    mixin { defaultRefmapName = 'sleepium.refmap.json' }
    accessWidenerPath = file('src/main/resources/sleepium.accesswidener')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
